name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          # 测试全部无需真实凭据；显式置空防止误用
          DEEPSEEK_API_KEY: ''
          FEISHU_APP_ID: ''
          WECOM_CORP_ID: ''
