name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Ubuntu + Windows 双平台：Windows 上 chmod 权限位不生效、路径分隔符不同，
    # 测试与 demo 运行器必须保持平台无关（历史教训：3 个用例曾在 Windows 上失败）。
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          # 测试全部无需真实凭据；显式置空防止误用
          DEEPSEEK_API_KEY: ''
          FEISHU_APP_ID: ''
          FEISHU_APP_SECRET: ''
          TELEGRAM_BOT_TOKEN: ''
          WECHAT_BOT_TOKEN: ''
          WECOM_CORP_ID: ''
