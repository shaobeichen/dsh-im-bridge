name: npm publish

# 手动在 GitHub 打 Release（tag 形如 v0.1.0）即触发：
#   测试 → 把 tag 版本同步进 4 个包的 package.json → 按顺序发布到 npm。
# 不需要在本地跑任何发布命令。
#
# 首次配置（一次性）：
#   1. npmjs.com → Access Tokens → Generate New Token → Automation
#   2. 仓库 Settings → Secrets → New repository secret → 名字 NPM_TOKEN，值=token
#
# 发布流程（以后每次都一样）：
#   1. GitHub 仓库 → Releases → Draft a new release
#   2. Choose a tag → 新建 v0.1.0（版本号随意，但必须是 semver，如 v0.1.0 / v1.2.3）
#   3. 写标题/说明 → Publish release
#   4. 到 Actions 页看发布进度，完成后 npm 上即可见

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - name: 测试
        run: npm test
      - name: 同步版本（tag → 4 包 version + 渠道 peerDependency 范围）
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "发布版本: $VERSION"
          echo "IM_VERSION=$VERSION" >> "$GITHUB_ENV"
          node - "$VERSION" <<'EOF'
          const fs = require('fs');
          const v = process.argv[2];
          const pkgs = ['packages/im', 'packages/im-telegram', 'packages/im-feishu', 'packages/im-wecom'];
          for (const dir of pkgs) {
            const f = `${dir}/package.json`;
            const d = JSON.parse(fs.readFileSync(f, 'utf8'));
            d.version = v;
            // 渠道包对核心的 peer 范围必须同步，否则 npm 会去 registry 找旧版本（404）
            if (d.peerDependencies && d.peerDependencies['dsh-im']) {
              d.peerDependencies['dsh-im'] = `^${v}`;
            }
            fs.writeFileSync(f, JSON.stringify(d, null, 2) + '\n');
          }
          console.log('已同步 4 包版本与 peer 范围到', v);
          EOF
      - name: 重建依赖树（workspace 链接匹配新版本/新 peer）
        run: npm install --no-audit --no-fund
      - name: 发布 dsh-im（核心，先发）
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view dsh-im@${{ env.IM_VERSION }} version >/dev/null 2>&1; then
            echo "dsh-im@${{ env.IM_VERSION }} 已存在，跳过"
          else
            npm publish --workspace dsh-im
          fi
      - name: 发布 dsh-im-telegram
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view dsh-im-telegram@${{ env.IM_VERSION }} version >/dev/null 2>&1; then
            echo "已存在，跳过"
          else
            npm publish --workspace dsh-im-telegram
          fi
      - name: 发布 dsh-im-feishu
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view dsh-im-feishu@${{ env.IM_VERSION }} version >/dev/null 2>&1; then
            echo "已存在，跳过"
          else
            npm publish --workspace dsh-im-feishu
          fi
      - name: 发布 dsh-im-wecom
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view dsh-im-wecom@${{ env.IM_VERSION }} version >/dev/null 2>&1; then
            echo "已存在，跳过"
          else
            npm publish --workspace dsh-im-wecom
          fi
